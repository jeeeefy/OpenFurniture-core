        <h1>Panel Furniture Designer</h1>
        <p>
          A free, local-first web app for designing panel furniture in 3D and generating a complete build document:
          cut list, cutting layout, drilling plans, hardware list and step-by-step assembly instructions. No account,
          no server, no telemetry — designs stay on your device. Available in English and German.
        </p>
        <p>This page needs JavaScript to run the designer. Enable JavaScript in a modern desktop browser to use it.</p>

        <h2>Features</h2>
        <ul>
          <li>Parametric 3D design of bookcases, cabinets, sideboards, chests of drawers, wardrobes and blank carcasses.</li>
          <li>Cut list with cut sizes, edge banding and material areas.</li>
          <li>Cutting layout with adjustable board size, saw kerf and edge trim.</li>
          <li>Hardware list and drilling plans to scale.</li>
          <li>Step-by-step assembly instructions with tools, safety callouts and 3D illustrations.</li>
          <li>A4 print and PDF output.</li>
          <li>Local-first storage with JSON export and import.</li>
        </ul>

        <h2>Frequently asked questions</h2>
        <h3>Is Panel Furniture Designer free?</h3>
        <p>Yes. The app is free to use in a modern desktop browser. There is no account, subscription or in-app purchase.</p>
        <h3>Do I need an account?</h3>
        <p>
          No. Designs are stored only in the browser on your device, and you can export them as files for backup or to
          move them to another browser. No design data is uploaded.
        </p>
        <h3>What can I design?</h3>
        <p>
          Bookcases, cabinets with doors, sideboards, chests of drawers, wardrobes and blank carcasses. Dimensions,
          plinth, columns, shelves, doors, drawers, handles, materials and hardware can be edited parametrically.
        </p>
        <h3>What does the app generate?</h3>
        <p>
          A cut list with cut sizes, edge banding and material areas; a cutting layout; a hardware list; drilling
          plans; step-by-step assembly instructions with 3D illustrations; and an A4 print or PDF document.
        </p>
        <h3>Are the generated plans safe to build from?</h3>
        <p>
          The documents are a planning aid, not an engineering or safety approval. Verify all dimensions, material
          strength, wall fixings and applicable safety rules before cutting or building.
        </p>
